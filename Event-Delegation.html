<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <script>
        const list = document.querySelector('#list');

        list.addEventListener('click', function (event) {
            console.log(event.target.innerText);
        });
    </script>
</body>

</html>
